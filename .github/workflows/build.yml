name: Windows build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Dependencies
        shell: powershell
        run: .\scripts\bootstrap-dependencies.ps1
      - name: Tests and build
        shell: powershell
        run: .\test.ps1
      - name: Package
        shell: powershell
        run: .\scripts\package.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Rustdesk-TUN-Helper-win-x64
          path: |
            outputs/*.zip
            outputs/SHA256SUMS.txt
          if-no-files-found: error
